[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness2go"
version = "0.1.0"
description = "Swiss-army knife for migrating coding-agent harness sessions (and their MCP/agent config) between OpenCode, Claude Code, and VS Code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thiago Jesus" },
]
keywords = ["opencode", "claude-code", "vscode", "copilot-chat", "cli", "migration"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thiagojesus/harness2go"
Repository = "https://github.com/thiagojesus/harness2go"
Issues = "https://github.com/thiagojesus/harness2go/issues"

[project.scripts]
h2go = "harness2go.cli:main"
opencode2claude = "harness2go.opencode2claude:main"
claude2opencode = "harness2go.claude2opencode:main"
vscode2opencode = "harness2go.vscode2opencode:main"
vscode2claude = "harness2go.vscode2claude:main"
opencode2vscode = "harness2go.opencode2vscode:main"
claude2vscode = "harness2go.claude2vscode:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness2go"]
